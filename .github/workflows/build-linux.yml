# Tube Fetch Desktop — build do pacote Linux (.deb) num runner ubuntu-latest.
#
# Pipeline: instala deps de sistema (GTK/WebKit2 dev + libs runtime p/ smoke test) e Python ->
# baixa ffmpeg e deno (builds Linux) -> PyInstaller (modo --onedir) -> smoke test com xvfb ->
# empacota com packaging/build-deb.sh -> publica o .deb como Release do GitHub, numa tag própria
# (desktop-linux-*, separada da tag desktop-* do build-windows.yml) — evita condição de corrida
# entre os dois workflows tentando criar/reaproveitar a mesma release no mesmo push.
#
# Depends de runtime do .deb (GTK/WebKit2) ficam em packaging/debian/control.template — não são
# bundlados pelo PyInstaller de propósito, ver comentário no início de
# packaging/tube-fetch-desktop-linux.spec.
#
# Paths: webapp/**, packaging/** e este arquivo.

name: build linux desktop

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "packaging/**"
      - ".github/workflows/build-linux.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-linux-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de sistema (GTK/WebKit2 dev + xvfb p/ smoke test)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            gobject-introspection libgtk-3-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            xvfb

      - name: Instalar dependências Python (runtime + PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r webapp/requirements.txt
          pip install pyinstaller

      - name: Baixar ffmpeg (BtbN/FFmpeg-Builds, linux64, branch estável n8.1)
        run: |
          mkdir -p build/bin
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz"
          curl -sSL "$url" -o ffmpeg.tar.xz
          mkdir -p ffmpeg_extract
          tar -xf ffmpeg.tar.xz -C ffmpeg_extract
          bin=$(find ffmpeg_extract -type f -name ffmpeg | head -n1)
          test -n "$bin"
          cp "$bin" build/bin/ffmpeg
          chmod +x build/bin/ffmpeg
          build/bin/ffmpeg -version | head -n1

      - name: Baixar deno (denoland/deno, release mais recente)
        run: |
          url="https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip"
          curl -sSL "$url" -o deno.zip
          unzip -o deno.zip -d build/bin
          chmod +x build/bin/deno
          build/bin/deno --version

      - name: Build com PyInstaller
        run: pyinstaller packaging/tube-fetch-desktop-linux.spec --noconfirm

      - name: Smoke test — o executável sobe e responde /health
        run: |
          xvfb-run --auto-servernum dist/tube-fetch-desktop/tube-fetch-desktop &
          pid=$!
          ok=""
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5000/health -o /tmp/health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "app não respondeu em /health a tempo" >&2
            exit 1
          fi
          cat /tmp/health.json

      - name: Definir versão do app
        id: ver
        run: echo "version=$(date -u +%Y.%m.%d)-$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Gerar pacote .deb
        run: packaging/build-deb.sh "${{ steps.ver.outputs.version }}" dist/tube-fetch-desktop packaging/Output

      - name: Publicar artefato do build (debug/inspeção)
        uses: actions/upload-artifact@v4
        with:
          name: TubeFetchDesktop-linux-${{ steps.ver.outputs.version }}
          path: packaging/Output/*.deb
          retention-days: 30

      - name: Publicar Release no GitHub
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="desktop-linux-${{ steps.ver.outputs.version }}"
          gh release create "$TAG" \
            packaging/Output/*.deb \
            --title "Tube Fetch Desktop (Linux) ${{ steps.ver.outputs.version }}" \
            --notes "Pacote .deb gerado automaticamente a partir do commit ${{ github.sha }}. Instale com 'sudo apt install ./tube-fetch-desktop_*.deb' — sem necessidade de Python, ffmpeg ou cookies.txt na maioria dos vídeos."
